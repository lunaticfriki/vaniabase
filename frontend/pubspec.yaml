name: frontend
description: "Flutter app for vaniabase (web, macOS, iOS, Android)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../core
  flutter_bloc: ^9.1.0
  get_it: ^7.7.0
  go_router: ^14.6.0
  google_fonts: ^8.2.1
  pixelarticons: ^0.4.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_dotenv: ^6.0.1
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  file_picker: 10.3.10
  spreadsheet_decoder: ^2.3.0
  csv: ^8.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#fafafa"
    theme_color: "#000000"
