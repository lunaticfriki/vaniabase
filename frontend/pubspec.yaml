name: frontend
description: "Flutter app for vaniabase (web, macOS, iOS, Android)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../core
  flutter_bloc: ^9.1.0
  get_it: ^7.7.0
  go_router: ^14.6.0
  google_fonts: ^8.2.1
  pixelarticons: ^0.4.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  flutter_dotenv: ^6.0.1
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
