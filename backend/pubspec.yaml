name: backend
description: >
  Dart server for vaniabase — HTTP API, Postgres persistence, JWT auth.
  Depends on core for domain/application logic.
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  core:
    path: ../core
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  postgres: ^3.5.0
  bcrypt: ^1.1.0
  dart_jsonwebtoken: ^2.14.0
  get_it: ^7.7.0
  crypto: ^3.0.0

dev_dependencies:
  test: ^1.25.0
  mocktail: ^1.0.0
  lints: ^5.0.0
