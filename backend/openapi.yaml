openapi: 3.0.3
info:
  title: vaniabase API
  version: 1.0.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Item:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        title: { type: string }
        creator: { type: array, items: { type: string } }
        publisher: { type: string }
        category: { type: string }
        format: { type: string }
        tags: { type: array, items: { type: string } }
        topic: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        language: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ItemInput:
      type: object
      required: [title, creator, publisher, category, format]
      properties:
        title: { type: string }
        creator: { type: array, items: { type: string } }
        publisher: { type: string }
        category: { type: string }
        format: { type: string }
        tags: { type: array, items: { type: string } }
        topic: { type: string }
        year: { type: integer }
        description: { type: string }
        language: { type: string }
        imageUrl: { type: string }
    Session:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email: { type: string }
                username: { type: string }
                password: { type: string }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }

  /auth/login:
    post:
      tags: [auth]
      summary: Log in and receive an access/refresh token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '204':
          description: Logged out

  /items:
    get:
      tags: [items]
      summary: List items owned by the authenticated user, paginated
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: A page of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
                  page: { type: integer }
                  pageSize: { type: integer }
                  totalItems: { type: integer }
                  totalPages: { type: integer }
    post:
      tags: [items]
      summary: Create an item
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [items]
      summary: Get an item by id
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
    patch:
      tags: [items]
      summary: Update an item
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemInput' }
      responses:
        '204':
          description: Item updated
    delete:
      tags: [items]
      summary: Delete an item
      security: [{ bearerAuth: [] }]
      responses:
        '204':
          description: Item deleted
